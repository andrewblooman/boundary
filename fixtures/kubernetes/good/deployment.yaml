apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: payments
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: app
          image: registry.local/app:1.4.2@sha256:8f3d3f6c9f1f4f8f0a2b7c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
