name: "Boundary policy scan"
description: >
  AI-first policy-as-code security scan (OPA) for Terraform, Dockerfiles,
  Kubernetes manifests, MCP configs, and agent skills.
author: "Andy Blooman"
branding:
  icon: "shield"
  color: "purple"

inputs:
  path:
    description: "File or directory to scan"
    default: "."
  targets:
    description: "Comma-separated kinds (terraform,docker,kubernetes,mcp,skills); empty = all"
    default: ""
  fail-on:
    description: "Fail the job when findings at/above this severity exist (CRITICAL|HIGH|MEDIUM|LOW|INFO|NEVER)"
    default: "HIGH"
  upload-sarif:
    description: "Upload results to GitHub Code Scanning"
    default: "true"
  opa-version:
    description: "OPA version to install"
    default: "1.19.1"
  comment-on-pr:
    description: >
      Post (and keep updated) a summary comment on the triggering pull request.
      No-op outside pull_request events. Requires the calling job to grant
      `permissions: pull-requests: write`; only works for PRs from the same
      repository (GITHUB_TOKEN is read-only on fork PRs by design).
    default: "true"

outputs:
  json:
    description: "Path to the Boundary JSON result file"
    value: ${{ steps.scan.outputs.json }}
  markdown:
    description: "Path to the Boundary Markdown summary file"
    value: ${{ steps.scan.outputs.markdown }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install OPA
      shell: bash
      run: |
        curl -sSL -o /usr/local/bin/opa \
          "https://openpolicyagent.org/downloads/v${{ inputs.opa-version }}/opa_linux_amd64_static"
        chmod +x /usr/local/bin/opa

    - name: Install Boundary
      shell: bash
      # editable install keeps the repo's policies/ directory as the policy root
      run: |
        pip install --quiet -e "${{ github.action_path }}/.."
        echo "BOUNDARY_POLICY_ROOT=${{ github.action_path }}/../policies" >> "$GITHUB_ENV"

    - name: Run scan
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        SCAN_TARGETS: ${{ inputs.targets }}
      run: |
        ARGS=()
        [ -n "$SCAN_TARGETS" ] && ARGS+=(--target "$SCAN_TARGETS")
        boundary scan "$SCAN_PATH" "${ARGS[@]}" \
          --format json --output boundary-results.json --fail-on NEVER
        boundary scan "$SCAN_PATH" "${ARGS[@]}" \
          --format sarif --output boundary-results.sarif --fail-on NEVER
        boundary scan "$SCAN_PATH" "${ARGS[@]}" \
          --format md --output boundary-summary.md --fail-on NEVER
        cat boundary-summary.md >> "$GITHUB_STEP_SUMMARY"
        echo "json=boundary-results.json" >> "$GITHUB_OUTPUT"
        echo "markdown=boundary-summary.md" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to Code Scanning
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: boundary-results.sarif
        category: boundary

    - name: Comment on PR
      if: ${{ github.event_name == 'pull_request' && inputs.comment-on-pr == 'true' }}
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- boundary-scan-summary -->';
          let summary = fs.readFileSync('${{ steps.scan.outputs.markdown }}', 'utf8');
          const sha = context.payload.pull_request.head.sha.slice(0, 7);
          const footer = `<sub>Boundary scan of \`${sha}\`. This comment is updated on every push to this PR.</sub>`;
          const budget = 65000 - marker.length - footer.length - 200; // GitHub's 65536 comment cap
          if (summary.length > budget) {
            summary = summary.slice(0, budget) +
              '\n\n> ⚠️ Output truncated — see the full results in the job summary or the `json`/`sarif` artifacts.';
          }
          const body = [marker, summary, '', footer].join('\n');

          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number, per_page: 100,
          });
          const existing = comments.find((c) => c.body && c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Enforce severity gate
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        SCAN_TARGETS: ${{ inputs.targets }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        ARGS=()
        [ -n "$SCAN_TARGETS" ] && ARGS+=(--target "$SCAN_TARGETS")
        boundary scan "$SCAN_PATH" "${ARGS[@]}" --format table --fail-on "$FAIL_ON"
